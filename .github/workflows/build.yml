name: build-dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Static sanity check
        run: |
          set -e
          for f in src/CoreOffline.m src/COIcon.m src/COLicenseDialog.m src/COVerifyBridge.m; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          test -f sdk/T3Verify.m || { echo "missing sdk/T3Verify.m"; exit 1; }
          echo "sources ok"

      - name: Build dylib
        run: make ARCHS="arm64"

      - name: Verify Mach-O
        run: |
          set -e
          otool -hv CoreOffline.work.dylib
          echo "── install name:"
          otool -D CoreOffline.work.dylib
          echo "── linked frameworks:"
          otool -L CoreOffline.work.dylib
          echo "── exported symbols:"
          nm -gU CoreOffline.work.dylib | grep -E "Core(Offline|Remote)" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreOffline.work.dylib
          path: CoreOffline.work.dylib
          if-no-files-found: error
