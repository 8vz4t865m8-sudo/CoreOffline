name: build-dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      # ─────────────────────────────────────────────────────────
      #  第一步：宿主对齐检查
      #
      #  ★ 这是本仓库最重要的一步。它逐条证明 src/CoreOffline.m
      #    的接管点与宿主 Core 1.6 的真实结构一致 ——
      #    每一条断言都对应一段反汇编证据（见 /workspace/卡密逆向/）。
      #    纯 Python，不需要 Xcode。
      # ─────────────────────────────────────────────────────────
      - name: Host parity check
        run: |
          set -e
          test -f src/CoreOffline.m || { echo "missing src/CoreOffline.m"; exit 1; }
          python3 checks/host_parity.py || { echo "❌ 接管逻辑偏离宿主结构"; exit 1; }

      - name: Static sanity check
        run: |
          set -e
          echo "── 断言：卡密那套「带副作用」的实现必须不在构建路径"
          for f in src/COEntry.m src/COVerifyBridge.m src/COKeychain.m \
                   src/COLicenseDialog.m src/COIcon.m sdk/T3Verify.m; do
            if [ -f "$f" ]; then
              echo "❌ $f 还在构建路径里"
              exit 1
            fi
          done
          echo "✅ 构建路径干净（旧实现已挪到 src/_license/ 留档）"

          echo "── 断言：源文件只有一个"
          n=$(ls src/*.m 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then
            echo "❌ src/ 下有 $n 个 .m 文件，应只有 CoreOffline.m"
            ls src/*.m
            exit 1
          fi
          echo "✅ 只有一个编译单元"

          # ★ 注意：先剥掉注释再断言。
          #   src/CoreOffline.m 的头部注释里**故意**提到了这些反模式
          #   （「上一版就是因为 objc_copyClassList 而崩」），
          #   直接 grep 会误报。
          python3 - <<'PY'
          import re, sys
          src = open("src/CoreOffline.m", encoding="utf-8").read()
          code = re.sub(r"/\*.*?\*/", "", src, flags=re.S)
          code = re.sub(r"//[^\n]*", "", code)

          bad = []

          # 把 completion 强转成 block 再调用 —— 上一版闪退的直接原因
          if re.search(r"\(\s*void\s*\(\s*\^\s*\)[^)]*\)\s*(completion|block)", code):
              bad.append("把 completion 强转成 block 再调用")
          if re.search(r"\bblk\s*\(", code):
              bad.append("直接调用 blk(...)")

          # 全局类遍历
          if re.search(r"objc_(copy|get)ClassList", code):
              bad.append("全局类遍历 objc_copyClassList")

          # Keychain / Security / 网络拦截
          if re.search(r"SecItem(Add|CopyMatching|Delete)", code):
              bad.append("Keychain API SecItem*")
          if re.search(r"NSURLSession|NSURLProtocol", code):
              bad.append("网络拦截 NSURLSession/NSURLProtocol")

          if bad:
              print("❌ 检测到以下反模式：")
              for b in bad:
                  print("   - " + b)
              sys.exit(1)

          print("✅ 未自己调 block / 零全局类遍历 / 零 Keychain / 零网络拦截")
          PY

      - name: Build dylib
        run: make ARCHS="arm64 arm64e"

      - name: Verify Mach-O
        run: |
          set -e
          otool -hv CoreOffline.work.dylib
          echo "── install name:"
          otool -D CoreOffline.work.dylib
          echo "── linked frameworks:"
          otool -L CoreOffline.work.dylib

          echo
          echo "════════ 架构断言（★ 必须双切片 arm64 + arm64e）════════"
          # 宿主 Core 是 thin arm64e；编双切片保证任何设备都不会因架构被拒。
          lipo -info CoreOffline.work.dylib
          ARCHS=$(lipo -archs CoreOffline.work.dylib)
          echo "$ARCHS" | grep -q "arm64"   || { echo "❌ 缺 arm64 切片"; exit 1; }
          echo "$ARCHS" | grep -q "arm64e"  || { echo "❌ 缺 arm64e 切片"; exit 1; }
          echo "✅ 双切片 arm64 + arm64e"

          echo
          echo "════════ install name 断言 ════════"
          otool -D CoreOffline.work.dylib | grep -q "@executable_path/CoreOffline.work.dylib" \
            || { echo "❌ install name 不对，注入后 dyld 找不到"; exit 1; }
          echo "✅ @executable_path/CoreOffline.work.dylib"

          echo
          echo "════════ 依赖断言（★ 只允许 Foundation + UIKit）════════"
          LIBS=$(otool -L CoreOffline.work.dylib | tail -n +2 | awk '{print $1}')
          echo "$LIBS"
          for want in Foundation UIKit; do
            echo "$LIBS" | grep -q "$want.framework" \
              || { echo "❌ 缺 $want"; exit 1; }
          done
          echo "✅ Foundation / UIKit 齐全"

          for bad in "Security.framework" "CFNetwork.framework" "CoreGraphics.framework" \
                     "CoreTelephony.framework" "SystemConfiguration.framework" \
                     "CryptoKit.framework" "QuartzCore.framework"; do
            if echo "$LIBS" | grep -q "$bad"; then
              echo "❌ 链了 $bad —— 会多一层 dyld 初始化，多一个闪退面"
              exit 1
            fi
          done
          echo "✅ 没有多链任何框架"

          echo
          echo "════════ ★★★ 导出符号断言（宿主 dlsym 要找这 5 个）════════"
          # 宿主的 5 个弱符号跳板，逐条对应：
          #   0x100003400 CoreOfflineBootstrap   0x100003800 CoreRemoteOpen
          #   0x100003500 CoreOfflinePrepare     0x100003900 CoreRemoteFault
          #   0x100003600 CoreOfflineFinalize
          for sym in CoreOfflineBootstrap CoreOfflinePrepare CoreOfflineFinalize \
                     CoreRemoteOpen CoreRemoteFault; do
            nm -gU CoreOffline.work.dylib | grep -q "_$sym\$" \
              || { echo "❌ 缺导出符号 _$sym —— 宿主的 dlsym 会返回 NULL，接管不生效"; exit 1; }
          done
          echo "✅ CoreOfflineBootstrap / Prepare / Finalize / RemoteOpen / RemoteFault"

          echo
          echo "════════ Keychain 断言（必须没链上）════════"
          if nm -u CoreOffline.work.dylib | grep -q "_SecItem"; then
            echo "❌ 链上了 SecItem* —— 自签下会返回 -34018"
            exit 1
          fi
          echo "✅ 没有 SecItem* 符号"

          echo
          echo "════════ 关键字符串断言 ════════"
          # ★ 这里必须与 src/CoreOffline.m 里实际使用的选择器一一对应。
          #   v3 的主接管点是 QXA117 finish:authorized:message:expiresAt:
          #   —— v2 时代的 verifyDeviceIdentifier:completion: 已经不再 hook，
          #   所以它**不应该**出现在二进制里（也不该出现在这份清单里）。
          for s in "qingxiugai.qingxiugai.qinxiugai" "2099-12-31 23:59:59" \
                   "QXA117" "QXA140" "QXA141" "QxF4" \
                   "finish:authorized:message:expiresAt:" \
                   "performPurpose:rootDeviceId:payload:completion:" \
                   "inputCard:transfer:" "qxRefreshExpiry"; do
            strings -a CoreOffline.work.dylib | grep -q "$s" \
              || { echo "❌ 缺关键字符串: $s"; exit 1; }
          done
          echo "✅ 宿主类名 / 方法名（4 个接管点）/ 到期常量齐全"

          # 反向断言：已废弃的 hook 目标不能回到二进制里，
          # 否则说明源码被改回了 v2 的旧路径（那个版本会自己调 block → 闪退）。
          for s in "verifyDeviceIdentifier:completion:"; do
            if strings -a CoreOffline.work.dylib | grep -q "$s"; then
              echo "❌ 出现已废弃的选择器: $s —— 源码可能被改回了 v2 路径"
              exit 1
            fi
          done
          echo "✅ 未回退到 v2 的 verifyDeviceIdentifier: 路径"

          echo
          echo "════════ 反模式断言（源码层面已查过，这里查二进制）════════"
          # 卡密验证的「实现代码」不应该出现在我们的 dylib 里。
          # 注意：QXA117 等只是**类名字符串**（用于 NSClassFromString），
          # 不是我们实现了它们，所以允许出现。
          if nm -u CoreOffline.work.dylib | grep -qE "_SecKeyCreateSignature|_CC_MD5|_CC_SHA256"; then
            echo "❌ 引用了签名/哈希函数 —— 说明把卡密计算引进来了"
            nm -u CoreOffline.work.dylib | grep -E "_SecKeyCreateSignature|_CC_MD5|_CC_SHA256"
            exit 1
          fi
          echo "✅ 没有引用签名/哈希函数"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreOffline-work-dylib
          path: CoreOffline.work.dylib
          if-no-files-found: error
