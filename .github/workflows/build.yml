name: build-dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Static sanity check
        run: |
          set -e
          for f in src/CoreOffline.m src/COIcon.m src/COLicenseDialog.m src/COVerifyBridge.m; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
          test -f sdk/T3Verify.m || { echo "missing sdk/T3Verify.m"; exit 1; }
          echo "sources ok"

          echo "── 构造函数早期安全性（真机闪退防线，必须有）"
          python3 checks/co_ctor.py || { echo "❌ 构造函数安全检查未通过"; exit 1; }

          echo "── 其他静态审计"
          for s in co_audit co_build co_logic co_realapi; do
            if [ -f "checks/$s.py" ]; then
              echo "   运行 checks/$s.py"
              python3 "checks/$s.py" || { echo "❌ $s 未通过"; exit 1; }
            fi
          done
          echo "✅ 审计通过"

      - name: Build dylib
        run: make ARCHS="arm64e"

      - name: Verify Mach-O
        run: |
          set -e
          otool -hv CoreOffline.work.dylib
          echo "── install name:"
          otool -D CoreOffline.work.dylib
          echo "── linked frameworks:"
          otool -L CoreOffline.work.dylib
          echo "── exported symbols:"
          nm -gU CoreOffline.work.dylib | grep -E "Core(Offline|Remote)" || true

          echo "── 架构断言（必须与原始测试版一致：arm64e）"
          # otool -hv 的列宽会把 ARM64E 截断显示成 "ARM64  E"，
          # caps 列也可能显示 USR00 而非 PAC00 —— 都不适合做断言。
          # 直接读 Mach-O 头的 cpusubtype 字段最可靠：
          #   arm64e 的 cpusubtype 是 0x80000002（CPU_SUBTYPE_ARM64E | 高位标志）
          python3 - <<'PY'
          import struct, sys
          d = open("CoreOffline.work.dylib", "rb").read()
          magic, cputype, cpusubtype = struct.unpack_from("<Iii", d, 0)
          assert magic == 0xfeedfacf, "不是 64 位 Mach-O"
          print("cputype=0x%x cpusubtype=0x%x" % (cputype, cpusubtype & 0xFFFFFFFF))
          sub = cpusubtype & 0xFFFFFFFF
          if sub != 0x80000002:
              print("❌ cpusubtype=0x%x，期望 0x80000002 (arm64e)" % sub)
              print("   原始测试版是 arm64e，编错架构在带 PAC 检查的环境下会注入异常")
              sys.exit(1)
          print("✅ arm64e (cpusubtype=0x80000002)")
          PY

          echo "── install name 断言"
          otool -D CoreOffline.work.dylib | grep -q "@executable_path/CoreOffline.work.dylib" \
            || { echo "❌ install name 不对，注入后 dyld 找不到"; exit 1; }
          echo "✅ install name ok"

          echo "── QuartzCore 断言（CABasicAnimation 用）"
          otool -L CoreOffline.work.dylib | grep -q "QuartzCore" \
            || { echo "❌ 缺 QuartzCore"; exit 1; }
          echo "✅ QuartzCore ok"

          echo "── 注入安全性断言：constructor 里不许有 NSUserDefaults / T3Verify 直接调用"
          if nm -u CoreOffline.work.dylib | grep -q "NSUserDefaults"; then
            echo "⚠️  有 NSUserDefaults 未定义符号（可能来自 COVerifyBridge，属预期）"
          fi
          echo "✅ 检查完成"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreOffline.work.dylib
          path: CoreOffline.work.dylib
          if-no-files-found: error
