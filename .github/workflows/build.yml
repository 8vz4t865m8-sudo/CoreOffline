name: build-dylib

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun -sdk iphoneos --show-sdk-version

      # ─────────────────────────────────────────────────────────
      #  第一步：行为一致性检查
      #
      #  ★ 这是本仓库最重要的一步。它逐条证明 src/CoreOffline.m
      #    没有偏离用户的测试版二进制 —— 每一条断言都对应一段反汇编证据。
      #    纯 Python，不需要 Xcode。
      # ─────────────────────────────────────────────────────────
      - name: Parity check vs original test build
        run: |
          set -e
          test -f src/CoreOffline.m || { echo "missing src/CoreOffline.m"; exit 1; }
          python3 checks/clone_parity.py || { echo "❌ 复刻版偏离了测试版"; exit 1; }

      - name: Static sanity check
        run: |
          set -e
          echo "── 断言：卡密那一套必须已经移出构建路径"
          for f in src/COEntry.m src/COVerifyBridge.m src/COKeychain.m \
                   src/COLicenseDialog.m src/COIcon.m sdk/T3Verify.m; do
            if [ -f "$f" ]; then
              echo "❌ $f 还在构建路径里 —— 这一轮要求完全基于测试版，不含卡密"
              exit 1
            fi
          done
          echo "✅ 构建路径干净（卡密已挪到 src/_license/ 留档）"

          echo "── 断言：源文件只有一个"
          n=$(ls src/*.m 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" != "1" ]; then
            echo "❌ src/ 下有 $n 个 .m 文件，应只有 CoreOffline.m"
            ls src/*.m
            exit 1
          fi
          echo "✅ 只有一个编译单元"

      - name: Build dylib
        run: make ARCHS="arm64e"

      - name: Verify Mach-O
        run: |
          set -e
          otool -hv CoreOffline.work.dylib
          echo "── install name:"
          otool -D CoreOffline.work.dylib
          echo "── linked frameworks:"
          otool -L CoreOffline.work.dylib

          echo
          echo "════════ 架构断言（必须 arm64e，与测试版一致）════════"
          python3 - <<'PY'
          import struct, sys
          d = open("CoreOffline.work.dylib", "rb").read()
          magic, cputype, cpusubtype = struct.unpack_from("<Iii", d, 0)
          assert magic == 0xfeedfacf, "不是 64 位 Mach-O"
          sub = cpusubtype & 0xFFFFFFFF
          print("cputype=0x%x cpusubtype=0x%x" % (cputype, sub))
          if sub != 0x80000002:
              print("❌ cpusubtype=0x%x，期望 0x80000002 (arm64e)" % sub)
              print("   测试版是 arm64e，编错架构在带 PAC 检查的环境下会注入异常")
              sys.exit(1)
          print("✅ arm64e (cpusubtype=0x80000002)")
          PY

          echo
          echo "════════ install name 断言 ════════"
          otool -D CoreOffline.work.dylib | grep -q "@executable_path/CoreOffline.work.dylib" \
            || { echo "❌ install name 不对，注入后 dyld 找不到"; exit 1; }
          echo "✅ @executable_path/CoreOffline.work.dylib"

          echo
          echo "════════ 依赖断言（★ 必须严格等于测试版的 3 个）════════"
          LIBS=$(otool -L CoreOffline.work.dylib | tail -n +2 | awk '{print $1}')
          echo "$LIBS"
          for want in Foundation UIKit QuartzCore; do
            echo "$LIBS" | grep -q "$want.framework" \
              || { echo "❌ 缺 $want"; exit 1; }
          done
          echo "✅ Foundation / UIKit / QuartzCore 齐全"

          for bad in "Security.framework" "CFNetwork.framework" "CoreGraphics.framework" \
                     "CoreTelephony.framework" "SystemConfiguration.framework"; do
            if echo "$LIBS" | grep -q "$bad"; then
              echo "❌ 链了测试版没有的 $bad —— 会多一层 dyld 初始化，多一个闪退面"
              exit 1
            fi
          done
          echo "✅ 没有多链任何框架（Security/CFNetwork/CoreGraphics 都没有）"

          echo
          echo "════════ 导出符号断言 ════════"
          for sym in CoreOfflineBootstrap CoreOfflinePrepare CoreOfflineFinalize \
                     CoreRemoteOpen CoreRemoteFault; do
            nm -gU CoreOffline.work.dylib | grep -q "_$sym\$" \
              || { echo "❌ 缺导出符号 _$sym"; exit 1; }
          done
          echo "✅ CoreOfflineBootstrap / Prepare / Finalize / RemoteOpen / RemoteFault"

          echo
          echo "════════ 卡密符号断言（★ 必须一个都没有）════════"
          if nm -gU CoreOffline.work.dylib | grep -qiE "verify|license|keychain|t3|card"; then
            echo "❌ 二进制里有卡密相关符号："
            nm -gU CoreOffline.work.dylib | grep -iE "verify|license|keychain|t3|card"
            exit 1
          fi
          echo "✅ 没有任何卡密相关符号"

          echo
          echo "════════ Keychain 断言（必须没链上）════════"
          if nm -u CoreOffline.work.dylib | grep -q "_SecItem"; then
            echo "❌ 链上了 SecItem* —— Security 框架被引进来了"
            exit 1
          fi
          echo "✅ 没有 SecItem* 符号"

          echo
          echo "════════ 关键字符串断言（测试版里真实存在的）════════"
          for s in "2099-12-31 23:59:59" "OKDHomeMusicController" \
                   "attachToRootView:" "refreshHomeLayoutArtwork" \
                   "authorizationValue" "setDisableUpdateMask:" \
                   "CoreHomeBanner.work" "api.appledb.dev" "fastly.jsdelivr.net"; do
            strings -a CoreOffline.work.dylib | grep -q "$s" \
              || { echo "❌ 缺关键字符串: $s"; exit 1; }
          done
          echo "✅ 关键字符串齐全"

          echo
          echo "════════ 幽灵字符串断言（测试版里**不存在**的）════════"
          # ★ 注意：openCommunity: 是 __objc_selrefs[3] 的**真实选择子名**，
          #   必须保留。它恰好含 "Community"，所以这里要排除掉它再判。
          GHOST=$(strings -a CoreOffline.work.dylib \
                  | grep -E "Community|社区|交流群|官方频道" \
                  | grep -v "^openCommunity:$" || true)
          if [ -n "$GHOST" ]; then
            echo "❌ 出现了测试版里不存在的标题："
            echo "$GHOST"
            exit 1
          fi
          echo "✅ 没有幽灵标题（openCommunity: 已排除，它是真实选择子名）"

          echo
          echo "════════ 按钮标题断言（★ 必须是那 5 个中文词）════════"
          for t in "查看公告" "提交工单" "工单进度" "激活续时" "检查更新"; do
            # __ustring 是 UTF-16LE，strings 默认读不出来，用 -e l
            if ! strings -a -e l CoreOffline.work.dylib | grep -q "$t"; then
              echo "❌ 缺按钮标题: $t"
              exit 1
            fi
          done
          echo "✅ 查看公告 / 提交工单 / 工单进度 / 激活续时 / 检查更新"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoreOffline.work.dylib
          path: CoreOffline.work.dylib
          if-no-files-found: error
